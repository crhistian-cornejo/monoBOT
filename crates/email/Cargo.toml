[package]
name = "monobot-email"
version.workspace = true
# Ported from Echo's echo-email, written for the 2024 edition.
edition = "2024"
license.workspace = true
description = "The user's mail in monoBOT: IMAP accounts with an app password (Gmail, iCloud or any server), reading, sorting and actions, and the reply the user sends with their own press. Ported from Echo (MIT)."

[dependencies]
monobot-http = { path = "../http" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23.1"
# The HTML of a message is cleaned against an allow list (`sanitize.rs`).
ammonia = "4"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
webpki-roots = "1"
