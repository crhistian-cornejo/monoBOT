[package]
name = "monobot-dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local speech-to-text for MonoBOT's composer: the microphone, voice activity (Silero) and Parakeet v3 through sherpa-onnx."

[dependencies]
# Pinned with the model files below; the same release Echo ships.
sherpa-onnx = "=1.13.8"
cpal = "=0.17.3"
sha2 = "0.10"
# The same client src-tauri already uses for downloads.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
# Parakeet's second source, a .tar.bz2 on GitHub, as Echo unpacks it.
tar = { version = "0.4", default-features = false }
bzip2 = "0.4"
thiserror.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows checks the download's certificate against its own store, as Echo
# does: a company network that inspects traffic signs with an authority only
# that store has, and the bundled list alone fails with UnknownIssuer.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
