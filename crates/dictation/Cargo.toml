[package]
name = "monobot-dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local speech-to-text for MonoBOT's composer: the microphone, voice activity (Silero) and Parakeet v3, on the Neural Engine through Core ML on Apple silicon and on the CPU through sherpa-onnx elsewhere."

[dependencies]
# Pinned with the model files below; the same release Echo ships.
sherpa-onnx = "=1.13.8"
cpal = "=0.17.3"
sha2 = "0.10"
# The same client src-tauri already uses for downloads.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
# Parakeet's second source, a .tar.bz2 on GitHub, as Echo unpacks it.
tar = { version = "0.4", default-features = false }
bzip2 = "0.4"
# The app's HTTPS settings: Windows' own certificate store, as Echo does.
monobot-http = { path = "../http" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Parakeet on the Neural Engine (`neural.rs`), straight from Rust.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSURL", "NSError", "NSObject"] }
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider"] }

