[package]
name = "monobot-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local voices for MonoBOT's group calls: Supertonic 3 through sherpa-onnx, speaking Spanish and English on this machine."

[dependencies]
# The pinned download and its checksum check are dictation's.
monobot-dictation = { path = "../dictation" }
# The same release dictation pins; it carries the Supertonic model family.
sherpa-onnx = "=1.13.8"
# The model ships as one .tar.bz2; both crates are already in the lockfile.
bzip2 = "0.5"
tar = "0.4"
serde_json.workspace = true
thiserror.workspace = true
