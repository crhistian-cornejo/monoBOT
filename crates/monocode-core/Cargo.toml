[package]
name = "monocode-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The user's Documents folder, where agents keep what they download.
dirs = "5.0.1"
serde.workspace = true
# Stored floats must reload exactly, or saved revisions stop matching.
serde_json = { workspace = true, features = ["float_roundtrip"] }
rusqlite.workspace = true
async-channel = "2"
shlex = "2"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
ical = "0.11"
sha2 = "0.10"
rand = "0.9"
regex = "1"
zstd = "0.14.3"
toml = "0.8"
ureq = "2.12"
webpki-roots = "0.26.11"
similar = "2"
unicode-width = "0.2"
# Group mentions read "@Análisis" as "@Analisis", as the desktop app does.
unicode-normalization = "0.1"
monocode-mobile-link = { path = "../mobile-link" }
# The user's mail, shared with the desktop app: the same accounts, secrets and snapshot.
monobot-email = { path = "../email" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"
hostname = "0.4"
igd-next = "0.18"
natpmp = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rquickjs = "0.14.0"
semver = { version = "1", features = ["serde"] }
minisign-verify = "0.2.5"
tempfile = "3"
flate2 = "1"
tar = "0.4"
# Agents read the web through the same certificate checks as every other client.
monobot-http = { path = "../http" }
scraper = { version = "0.29", default-features = false }
# Office documents are zip packages of XML parts, read for the file viewer.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
# Bounded PDF text extraction for the native paper reader.
lopdf = { version = "0.45", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rusty-leveldb = "1"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }

# Exercise WebView2 storage fixtures on Linux and macOS too.
[target.'cfg(not(windows))'.dev-dependencies]
rusty-leveldb = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
