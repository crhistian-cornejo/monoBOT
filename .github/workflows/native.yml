name: MonoBOT Native Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/monocode-core/**'
      - 'crates/monocode-gpui/**'
      - 'crates/mobile-link/**'
      - 'host/**'
      - 'deploy/cloudflare-mail/**'
      - 'vendor/gpui-pre*/**'
      - 'xtask/**'
      - 'scripts/generators/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native.yml'
      - '.github/workflows/native-release.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux core dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      # Build, packaging and release tooling (dev runner, bundles, packages,
      # update signing, dependency guards).
      - run: cargo test --locked -p xtask
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --profile native-dev

  desktop:
    name: MonoBOT Native (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # fmt --check, clippy -D warnings (core, GPUI, xtask) and the xtask tests.
      - run: cargo xtask check
      - run: cargo xtask test
      - run: cargo build --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-gpui --profile native-dev

  host:
    name: Remote host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: host/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: host/pnpm-lock.yaml
      - run: pnpm --dir host install --frozen-lockfile
      - run: pnpm --dir host test

  mail-worker:
    name: Mail Worker (Rust → wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare-mail
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked
