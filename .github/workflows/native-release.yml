name: Release

# Builds every platform, signs the update packages and the feed, and publishes
# them to the monobot-releases R2 bucket, which the update Worker
# (deploy/cloudflare-updates) serves. No GitHub release: the repository is
# private, so its assets would not be downloadable.
on:
  push:
    # v0.0.1, or v0.0.2-preview.1 for a preview.
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: native-preview-release
  cancel-in-progress: false

jobs:
  # macOS packages must be signed and notarized. Without the Apple
  # credentials the release ships Windows and Linux only, and says so.
  plan:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      without_macos: ${{ steps.plan.outputs.without_macos }}
    steps:
      - id: plan
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          # Like release.yml: AppKit draws its controls (traffic lights, menus)
          # for the SDK the app links against, and only the newest Apple
          # silicon images ship a current one, so Intel cross-compiles there.
          MAC='{"os":"macos-latest","target":"aarch64-apple-darwin","arch":"aarch64","kind":"macos"},{"os":"macos-latest","target":"x86_64-apple-darwin","arch":"x86_64","kind":"macos"},'
          # Linux is not published for now (MONOBOT_RELEASE_WITHOUT_LINUX below).
          # To bring it back, add this entry and re-enable the rpm job:
          # {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","arch":"x86_64","kind":"linux"},
          REST='{"os":"windows-latest","target":"x86_64-pc-windows-msvc","arch":"x86_64","kind":"windows"}'
          if [ "$HAS_APPLE" = true ]; then
            echo "matrix={\"include\":[${MAC}${REST}]}" >> "$GITHUB_OUTPUT"
            echo "without_macos=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Apple signing credentials: this release ships Windows only."
            echo "matrix={\"include\":[${REST}]}" >> "$GITHUB_OUTPUT"
            echo "without_macos=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      MONOBOT_UPDATER_PUBKEY: ${{ secrets.MONOBOT_UPDATER_PUBKEY }}
      MONOBOT_UPDATES_URL: ${{ secrets.MONOBOT_UPDATES_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-release-${{ matrix.target }}
          cache-on-failure: true
      - name: Configure native channel and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cargo xtask release-version "$VERSION"
          test -n "$MONOBOT_UPDATER_PUBKEY"
          test -n "$MONOBOT_UPDATES_URL"
          echo "MONOCODE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=${MONOBOT_UPDATES_URL%/}/latest.json" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$MONOBOT_UPDATER_PUBKEY" >> "$GITHUB_ENV"
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Install native Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import existing Apple distribution credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = root / 'native-signing.p12'
          certificate.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          certificate.chmod(0o600)
          key = root / 'native-notary.p8'
          key.write_text(os.environ['APPLE_API_KEY_P8'])
          key.chmod(0o600)
          PY
          KEYCHAIN="$RUNNER_TEMP/native-signing.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/native-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/native-notary.p8" >> "$GITHUB_ENV"
      - run: cargo test --locked -p xtask
      - name: Test native update backend
        run: cargo test --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --profile native-dev app_update
      - name: Reclaim Mac updater-test build space
        if: runner.os == 'macOS'
        run: |
          df -h .
          cargo clean --manifest-path crates/monocode-gpui/Cargo.toml --profile native-dev
          df -h .
      - name: Require a current macOS SDK
        if: runner.os == 'macOS'
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          if (( ${sdk%%.*} < 26 )); then
            echo "macOS SDK $sdk would draw pre-macOS 26 window controls" >&2
            exit 1
          fi
          # Xcode 26 ships the Metal compiler GPUI's shaders need separately.
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - name: Install Rosetta to run the Intel build while packaging
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true
      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release
      - name: Use TCP for Mac notarization
        if: runner.os == 'macOS'
        run: |
          # Mac runners can drop HTTP/3 connections to Apple's ticket service.
          # Scope this workaround to the disposable runners; preserve
          # notarization, ticket validation and Gatekeeper checks.
          # https://github.com/actions/runner-images/issues/14924
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Package native app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/monocode-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          cargo xtask package '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native-dist/*.json
            native-dist/*.dmg
            native-dist/*.tar.gz
            native-dist/*.AppImage
            native-dist/*.deb
            native-dist/*.exe
          if-no-files-found: error
      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/native-signing.p12" "$RUNNER_TEMP/native-notary.p8"

  rpm:
    name: Build (Enterprise Linux rpm)
    # Linux is not published for now; see the plan job.
    if: false
    runs-on: ubuntu-latest
    container: almalinux:10
    env:
      CARGO_BUILD_JOBS: 2
      MONOBOT_UPDATER_PUBKEY: ${{ secrets.MONOBOT_UPDATER_PUBKEY }}
      MONOBOT_UPDATES_URL: ${{ secrets.MONOBOT_UPDATES_URL }}
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure native rpm channel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cargo xtask release-version "$VERSION"
          test -n "$MONOBOT_UPDATER_PUBKEY"
          test -n "$MONOBOT_UPDATES_URL"
          echo "MONOCODE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=${MONOBOT_UPDATES_URL%/}/latest.json" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$MONOBOT_UPDATER_PUBKEY" >> "$GITHUB_ENV"
      - run: cargo test --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --profile native-dev app_update
      - run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release
      - run: cargo xtask package rpm target/release/monocode-gpui native-dist x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-rpm
          path: |
            native-dist/*.json
            native-dist/*.rpm
          if-no-files-found: error

  host:
    name: Remote host packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: host/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: host/pnpm-lock.yaml
      - run: pnpm --dir host install --frozen-lockfile
      - run: pnpm --dir host test
      - name: Cache pinned host runtimes
        uses: actions/cache@v4
        with:
          path: host/build/host-runtime-cache
          key: host-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'Linux' && 'all' || 'native' }}-${{ hashFiles('host/scripts/package.mjs') }}
      - run: pnpm --dir host package -- --all
        if: runner.os == 'Linux'
      - run: pnpm --dir host package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            host/build/host-packages/*.tar.gz
            host/build/host-packages/*.zip
            host/build/host-packages/*.sha256
          if-no-files-found: error

  publish:
    name: Publish to R2 behind the update Worker
    needs: [plan, build, host]
    runs-on: ubuntu-latest
    env:
      MONOBOT_RELEASE_WITHOUT_MACOS: ${{ needs.plan.outputs.without_macos }}
      MONOBOT_RELEASE_WITHOUT_LINUX: "1"
      MONOBOT_UPDATER_PRIVATE_KEY: ${{ secrets.MONOBOT_UPDATER_PRIVATE_KEY }}
      MONOBOT_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.MONOBOT_UPDATER_PRIVATE_KEY_PASSWORD }}
      MONOBOT_UPDATER_PUBKEY: ${{ secrets.MONOBOT_UPDATER_PUBKEY }}
      MONOBOT_UPDATES_URL: ${{ secrets.MONOBOT_UPDATES_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-dist
      - uses: actions/download-artifact@v4
        with:
          name: host-packages
          path: host-packages
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-publication-verifier
      # The verifier links monocode-core, which needs these system libraries.
      - name: Install the verifier's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev
      - name: Sign all update packages, the feed and the download list
        run: |
          echo "MONOCODE_NATIVE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          MONOCODE_NATIVE_VERSION="${GITHUB_REF_NAME#v}" cargo xtask release native-dist
      - name: Verify the signed feed and all packages with the native client
        run: cargo xtask verify-release native-dist
      - name: Publish to R2
        run: |
          set -euo pipefail
          # R2_ACCESS_KEY_ID may hold the R2 API token itself (cfat_…) rather
          # than its 32-character S3 key id. R2's S3 credentials come from the
          # token: the key id is the token's id, the secret is the SHA-256 of
          # its value (https://developers.cloudflare.com/r2/api/tokens/).
          if [ "${#AWS_ACCESS_KEY_ID}" -ne 32 ]; then
            TOKEN="$AWS_ACCESS_KEY_ID"
            ID=""
            for VERIFY in "accounts/${R2_ACCOUNT_ID}/tokens/verify" "user/tokens/verify"; do
              ID=$(curl --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/$VERIFY" | jq -r '.result.id // empty') || true
              [ -n "$ID" ] && break
            done
            if [ "${#ID}" -ne 32 ]; then
              echo "R2_ACCESS_KEY_ID is neither an S3 access key id nor a working R2 API token." >&2
              exit 1
            fi
            SECRET=$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)
            echo "::add-mask::$ID"
            echo "::add-mask::$SECRET"
            export AWS_ACCESS_KEY_ID="$ID" AWS_SECRET_ACCESS_KEY="$SECRET"
            echo "Using the S3 credentials of the R2 API token."
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="releases/${MONOCODE_NATIVE_VERSION}"
          # A published version is immutable: a fix ships as a new version.
          if aws s3api head-object --bucket "$R2_BUCKET_NAME" --key "$PREFIX/release-files.json" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "Version ${MONOCODE_NATIVE_VERSION} is already published. Tag a new version." >&2
            exit 1
          fi
          upload() {
            aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$PREFIX/$(basename "$1")" --cache-control 'public,max-age=31536000,immutable' --endpoint-url "$ENDPOINT"
          }
          jq -r '.[]' native-dist/release-files.json | while IFS= read -r file; do
            upload "native-dist/$file"
          done
          HOST_ARCHIVES=(host-packages/*.tar.gz host-packages/*.zip)
          if (( ${#HOST_ARCHIVES[@]} != 6 )); then
            echo "Expected six host archives" >&2
            exit 1
          fi
          for archive in "${HOST_ARCHIVES[@]}"; do
            test -f "$archive.sha256" || { echo "Missing host checksum: $archive.sha256" >&2; exit 1; }
            upload "$archive"
            upload "$archive.sha256"
          done
          upload native-dist/release-files.json
          # The two mutable files go last, once every file they name exists.
          aws s3 cp native-dist/downloads.json "s3://${R2_BUCKET_NAME}/downloads.json" --content-type application/json --cache-control 'no-store,max-age=0,must-revalidate' --endpoint-url "$ENDPOINT"
          aws s3 cp native-dist/latest.json "s3://${R2_BUCKET_NAME}/latest.json" --content-type application/json --cache-control 'no-store,max-age=0,must-revalidate' --endpoint-url "$ENDPOINT"
      - name: Check the Worker serves the new version
        run: |
          set -euo pipefail
          BASE="${MONOBOT_UPDATES_URL%/}"
          curl --fail --silent --show-error "$BASE/downloads.json" | jq -e --arg v "$MONOCODE_NATIVE_VERSION" '.version == $v'
          curl --fail --silent --show-error --head "$BASE/download/windows" | grep -i '^location:'
