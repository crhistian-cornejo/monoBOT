[package]
name = "monobot-inbound-mail"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional Cloudflare Email Routing inbound Worker for monoBOT (D1 index + R2 raw MIME, pull API)."

# Built on its own for wasm32 by worker-build, not as part of the desktop workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
