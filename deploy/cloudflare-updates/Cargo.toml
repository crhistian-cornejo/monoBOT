[package]
name = "monobot-updates"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
description = "Cloudflare Worker that serves monoBOT's signed update feed and installers from R2."

# Built on its own for wasm32 by worker-build, not as part of the desktop workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
