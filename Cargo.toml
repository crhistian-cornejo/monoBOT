[workspace]
resolver = "2"
members = [
  "crates/monocode-gpui",
  "crates/monocode-core",
  "crates/dictation",
  "crates/email",
  "crates/http",
  "crates/live",
  "crates/mobile-link",
  "crates/persona",
  "crates/voice",
  "xtask",
]
exclude = [
  "vendor/gpui-pre",
  "vendor/gpui-pre-apple",
  "vendor/gpui-pre-linux",
  "vendor/gpui-pre-macos",
  "vendor/gpui-pre-windows",
]

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# Release builds: one codegen unit and thin LTO let rustc inline across crates,
# which makes the app smaller and faster.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = false

[profile.native-dev.package."*"]
opt-level = 1

[profile.native-dev.package.monocode-gpui]
opt-level = 1

# xtask opens the update signing key with scrypt, which takes seconds per key
# without optimizations.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
