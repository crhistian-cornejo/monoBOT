[workspace]
resolver = "2"
members = ["src-tauri", "crates/mobile-link", "crates/dictation", "crates/http", "crates/voice", "crates/email", "crates/visual"]
exclude = ["vendor/portable-pty", "vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-linux", "vendor/gpui-pre-macos", "vendor/gpui-pre-windows", "crates/monocode-core", "crates/monocode-gpui"]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release builds: one codegen unit and thin LTO let rustc inline across crates,
# which makes the app smaller and faster. Panics keep unwinding because
# mobile-link's FFI and macos_background catch them, and symbol names stay so
# panic backtraces remain readable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
