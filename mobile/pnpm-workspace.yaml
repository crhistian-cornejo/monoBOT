# Standalone pnpm project (not part of the root workspace).

# Flat node_modules like npm: Expo/React Native tooling and the build scripts
# here read package folders directly from node_modules.
nodeLinker: hoisted

# Only these dependencies may run install scripts. Anything new must be
# reviewed and added here explicitly.
allowBuilds:
  esbuild: true
  # Its postinstall only repairs a missing native binding; the optional
  # platform package already provides it.
  unrs-resolver: false

# Do not install versions published less than 3 days ago, so compromised
# releases are usually caught and pulled from the registry first.
minimumReleaseAge: 4320
